<body class="pu-shell pu-status-page">
    <main class="pu-status-card container">
        <a href="index.html" class="pu-status-card__brand" aria-label="PlantUp">
            <svg class="pu-status-card__brand-mark" viewBox="0 0 32 32" fill="none" aria-hidden="true">
                <path d="M6 26 L16 6 L22 26 Z" fill="#e8fe85"/>
                <path d="M12 26 L16 6 L26 26 Z" fill="#07503f"/>

        <div class="pu-status-card__icon icon pu-status-card__icon--pending" id="payment-icon" data-status="pending" aria-hidden="true"></div>
        <h1 class="pu-status-card__title" id="payment-title">Ověřujeme stav platby...</h1>
        <p class="pu-status-card__text" id="payment-description">Prosím chvíli počkejte, potvrzujeme výsledek platby.</p>

        <div class="pu-status-card__details order-details" id="order-details" style="display: none;">

                <span class="pu-status-card__row-value order-value" id="order-no">-</span>
            </div>
            <div class="pu-status-card__row order-row">
                <span class="pu-status-card__row-label order-label">Částka</span>
                <span class="pu-status-card__row-value order-value" id="amount">-</span>
            </div>
            <div class="pu-status-card__row order-row">
                <span class="pu-status-card__row-label order-label">Transakce</span>
                <span class="pu-status-card__row-value order-value" id="transaction-id">-</span>
            </div>
        </div>

        <a href="member-dashboard.html" class="pu-btn pu-btn--forest btn btn-primary" id="dashboard-link">Přejít do mého účtu</a>
